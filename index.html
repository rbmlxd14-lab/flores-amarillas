<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas Para Ti 💛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #271900 0%, #070500 100%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      text-align: center;
      padding: 16px;
    }

    .flower {
      position: fixed;
      top: -50px;
      font-size: 26px;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      border-radius: 28px;
      padding: 24px 20px;
      max-width: 375px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(255, 215, 0, 0.25);
      z-index: 10;
    }

    /* Foto enfocada y centrada directamente en ella */
    .photo-container {
      width: 220px;
      height: 220px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
      overflow: hidden;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 38% 58%;
      transform: scale(1.85);
    }

    h1 {
      color: #ffd700;
      font-size: 1.65rem;
      margin-bottom: 6px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 0 2px 10px rgba(0,0,0,0.8);
      font-weight: 700;
    }

    /* Frase en dorado brillante */
    .golden-love {
      display: block;
      color: #ffe066;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 170, 0, 0.5);
      font-style: italic;
    }

    p {
      color: #f7f7f7;
      font-size: 0.96rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .tag {
      display: inline-block;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-container">
      <img src="B612_20260628_140501_279.jpg" alt="Foto especial">
    </div>

    <h1>Flores para ti 🌻</h1>
    
    <div class="golden-love">¡Te amo mi bb! 💛</div>

    <p>
      Aunque hoy nos toque estar lejos, no quería dejar pasar este día sin mandarte tus flores amarillas. Gracias por iluminar mis días incluso a la distancia. 
    </p>

    <div class="tag">Con todo mi amor ✨</div>
  </div>

  <script>
    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      const icons = ['🌻', '🌼', '💛', '✨', '💐'];
      flower.innerText = icons[Math.floor(Math.random() * icons.length)];
      flower.style.left = Math.random() * 95 + 'vw';
      flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
      flower.style.fontSize = (Math.random() * 16 + 18) + 'px';
      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 6000);
    }
    setInterval(createFlower, 280);
  </script>
</body>
</html>
