<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas Para Ti 💛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #2a1b00 0%, #080600 100%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 16px;
      position: relative;
    }

    /* Animación fluida de lluvia de flores */
    .flower {
      position: fixed;
      top: -80px;
      user-select: none;
      pointer-events: none;
      z-index: 25;
      animation: fallSwing linear forwards;
    }

    @keyframes fallSwing {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.95;
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(115vh) rotate(360deg) translateX(-20px);
        opacity: 0.85;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      border-radius: 28px;
      padding: 24px 20px;
      max-width: 375px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(255, 215, 0, 0.25);
      z-index: 10;
      position: relative;
    }

    .photo-container {
      width: 215px;
      height: 215px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
      overflow: hidden;
    }

    /* Sin zoom adicional para respetar tu recorte */
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      color: #ffd700;
      font-size: 1.65rem;
      margin-bottom: 4px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 0 2px 10px rgba(0,0,0,0.8);
      font-weight: 700;
    }

    .golden-love {
      display: block;
      color: #ffe066;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.85), 0 0 25px rgba(255, 170, 0, 0.55);
      font-style: italic;
    }

    p {
      color: #f7f7f7;
      font-size: 0.96rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .tag {
      display: inline-block;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-container">
      <img src="IMG_20260921_200340.jpg" alt="Foto especial">
    </div>

    <h1>Flores para ti 🌻</h1>
    
    <div class="golden-love">¡Te amo mi bb! 💛</div>

    <p>
      Aunque hoy nos toque estar lejos, no quería dejar pasar este día sin mandarte tus flores amarillas. Gracias por iluminar mis días incluso a la distancia. 
    </p>

    <div class="tag">Con todo mi amor ✨</div>
  </div>

  <script>
    function createFallingFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');

      const items = ['🌻', '🌻', '🌼', '🌼', '💛', '✨', '💐'];
      flower.innerText = items[Math.floor(Math.random() * items.length)];

      flower.style.left = Math.random() * 100 + 'vw';

      // Flores más grandes: entre 28px y 52px
      const size = Math.floor(Math.random() * 25 + 28);
      flower.style.fontSize = size + 'px';

      const duration = Math.random() * 2.5 + 3.2;
      flower.style.animationDuration = duration + 's';

      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, duration * 1000);
    }

    // Lluvia abundante
    setInterval(createFallingFlower, 130);
  </script>
</body>
</html>
