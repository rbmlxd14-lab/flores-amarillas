<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas Para Ti 💛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #241800 0%, #080600 100%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      text-align: center;
      padding: 20px;
    }

    .flower {
      position: fixed;
      top: -50px;
      font-size: 26px;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 28px;
      padding: 28px 22px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 12px 35px rgba(255, 215, 0, 0.2);
      z-index: 10;
    }

    .photo-container {
      width: 170px;
      height: 170px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      overflow: hidden;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      color: #ffd700;
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    p {
      color: #f7f7f7;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .tag {
      display: inline-block;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-container">
      <img src="B612_20260628_140501_279.jpg" alt="Foto especial">
    </div>

    <h1>Flores para ti 🌻</h1>

    <p>
      Aunque hoy nos toque estar lejos, no quería dejar pasar este día sin mandarte tus flores amarillas. Gracias por iluminar mis días incluso a la distancia. Te amo muchísimo. 💛
    </p>

    <div class="tag">Con todo mi amor ✨</div>
  </div>

  <script>
    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      const icons = ['🌻', '🌼', '💛', '✨', '💐'];
      flower.innerText = icons[Math.floor(Math.random() * icons.length)];
      flower.style.left = Math.random() * 95 + 'vw';
      flower.style.animationDuration = (Math.random() * 3 + 3) + 's';
      flower.style.fontSize = (Math.random() * 16 + 18) + 'px';
      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 6000);
    }
    setInterval(createFlower, 280);
  </script>
</body>
  </html>
